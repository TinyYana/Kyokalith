# Kyokalith main config (decoy model)
# Vanilla world-gen ores are kept as decoys; a fully buried position is resolved by a
# deterministic vein function at its first exposure. World generation is never touched
# and nothing is scanned — the only block writes happen at the moment of first exposure.
# The vein function, eligible ore tokens, OreCheckTriggerEvent and the NatureRevive
# epoch bridge are all implemented in-plugin.

# Locale for admin command output. Bundled: en, zh_TW.
# Files under plugins/Kyokalith/lang/<locale>.yml override the bundled text key-by-key;
# add your own lang/<name>.yml and point locale at it for a custom language.
locale: zh_TW
config_schema_version: 2

database:
  file: kyokalith.db
  dirty_flush_interval_ticks: 40

# dimension maps to Bukkit World.Environment (NORMAL/NETHER/THE_END). Omitted = NORMAL,
# and the match is exact — nether ore types must explicitly say NETHER.
# Ore types with enabled: false are fully ignored: decoys stay vanilla, mining is vanilla,
# and no OreCheckTriggerEvent fires.
#
# priority (Int, default 0): whole-shape tie-break when different ore candidates overlap.
# Higher priority keeps its complete face-connected vein; the loser is discarded completely
# instead of leaving 1–2 block fragments. Equal priority falls back to stable veinId order.
# Same-ore shapes from adjacent cells are also never allowed to touch: the lower veinId survives,
# giving every component a hard endpoint. The winner and priority show up in `/kyo inspect`.
ores:
  # y_weight_points is an optional piecewise-linear activation curve. Bundled curves reproduce
  # vanilla-like double peaks, plateaus, uniform bands and mixed peak+background distributions.
  # Custom configs without it keep the legacy triangular preferred_y behavior.
  coal:
    enabled: true
    materials:
      stone: COAL_ORE
      deepslate: DEEPSLATE_COAL_ORE
    # Vanilla-like: Y=0~320, strong around Y=96 and a high-altitude plateau above Y=136.
    y_min: 0
    y_max: 320
    preferred_y: 96
    y_weight_points:
      - { y: 0, weight: 0.0 }
      - { y: 96, weight: 0.65 }
      - { y: 136, weight: 1.0 }
      - { y: 320, weight: 1.0 }
    density: 1.0
    vein_size_min: 3
    vein_size_max: 7
    cell_chance: 0.28
    priority: 10
  iron:
    enabled: true
    materials:
      stone: IRON_ORE
      deepslate: DEEPSLATE_IRON_ORE
    # Vanilla-like double peak at Y=16 and Y=232.
    y_min: -64
    y_max: 320
    preferred_y: 16
    y_weight_points:
      - { y: -64, weight: 0.10 }
      - { y: 16, weight: 1.0 }
      - { y: 96, weight: 0.20 }
      - { y: 232, weight: 1.0 }
      - { y: 320, weight: 0.10 }
    density: 1.0
    vein_size_min: 3
    vein_size_max: 7
    cell_chance: 0.28
    priority: 20
  copper:
    enabled: true
    materials:
      stone: COPPER_ORE
      deepslate: DEEPSLATE_COPPER_ORE
    # Vanilla-like: Y=-16~112, peak Y=48. Dripstone biome bonus is not modeled.
    y_min: -16
    y_max: 112
    preferred_y: 48
    y_weight_points:
      - { y: -16, weight: 0.0 }
      - { y: 48, weight: 1.0 }
      - { y: 112, weight: 0.0 }
    density: 1.0
    vein_size_min: 3
    vein_size_max: 8
    cell_chance: 0.24
    priority: 15
  gold:
    enabled: true
    materials:
      stone: GOLD_ORE
      deepslate: DEEPSLATE_GOLD_ORE
    # 原版:Y=-64~32,Y=-16 最常見(惡地生物群系可到 Y=256,沒有生物群系概念,略過)——
    # 範圍與 peak 原本就對,沒有異動。
    y_min: -64
    y_max: 32
    preferred_y: -16
    y_weight_points:
      - { y: -64, weight: 0.0 }
      - { y: -16, weight: 1.0 }
      - { y: 32, weight: 0.0 }
    density: 1.0
    vein_size_min: 2
    vein_size_max: 6
    cell_chance: 0.17
    priority: 40
  redstone:
    enabled: true
    materials:
      stone: REDSTONE_ORE
      deepslate: DEEPSLATE_REDSTONE_ORE
    # 原版:Y=-64~16,跟鑽石一樣在 Y=-59 最常見——原本 preferred_y 錯設成 -32,改成 -59。
    y_min: -64
    y_max: 15
    preferred_y: -59
    y_weight_points:
      - { y: -64, weight: 1.0 }
      - { y: -59, weight: 1.0 }
      - { y: 15, weight: 0.0 }
    density: 1.0
    vein_size_min: 3
    vein_size_max: 7
    cell_chance: 0.20
    priority: 30
  lapis:
    enabled: true
    materials:
      stone: LAPIS_ORE
      deepslate: DEEPSLATE_LAPIS_ORE
    y_min: -64
    y_max: 64
    preferred_y: 0
    y_weight_points:
      - { y: -64, weight: 0.0 }
      - { y: 0, weight: 1.0 }
      - { y: 64, weight: 0.0 }
    density: 1.0
    vein_size_min: 2
    vein_size_max: 5
    cell_chance: 0.17
    priority: 35
  diamond:
    enabled: true
    materials:
      stone: DIAMOND_ORE
      deepslate: DEEPSLATE_DIAMOND_ORE
    y_min: -64
    y_max: 16
    preferred_y: -59
    y_weight_points:
      - { y: -64, weight: 1.0 }
      - { y: -59, weight: 1.0 }
      - { y: 16, weight: 0.0 }
    density: 1.0
    vein_size_min: 2
    vein_size_max: 5
    cell_chance: 0.09
    priority: 70
  emerald:
    enabled: true
    materials:
      stone: EMERALD_ORE
      deepslate: DEEPSLATE_EMERALD_ORE
    # Vanilla-like mountain band: Y=-16~320, peak around Y=232. Biome gating is not modeled.
    y_min: -16
    y_max: 320
    preferred_y: 232
    y_weight_points:
      - { y: -16, weight: 0.0 }
      - { y: 232, weight: 1.0 }
      - { y: 320, weight: 0.70 }
    density: 1.0
    vein_size_min: 1
    vein_size_max: 2
    cell_chance: 0.035
    priority: 80
  # Nether quartz/gold are uniform in Y=10~117; the listed Y15/Y114 mining levels are safe
  # routes rather than probability peaks. Biome multipliers are not modeled.
  nether_quartz:
    enabled: true
    dimension: NETHER
    materials:
      stone: NETHER_QUARTZ_ORE
    y_min: 10
    y_max: 117
    preferred_y: 15
    y_weight_points:
      - { y: 10, weight: 1.0 }
      - { y: 117, weight: 1.0 }
    density: 1.0
    vein_size_min: 4
    vein_size_max: 9
    cell_chance: 0.42
    priority: 10
  nether_gold:
    enabled: true
    dimension: NETHER
    materials:
      stone: NETHER_GOLD_ORE
    y_min: 10
    y_max: 117
    preferred_y: 15
    y_weight_points:
      - { y: 10, weight: 1.0 }
      - { y: 117, weight: 1.0 }
    density: 1.0
    vein_size_min: 3
    vein_size_max: 7
    cell_chance: 0.25
    priority: 40
  # Ancient debris remains much rarer than quartz/gold. Its curve combines the vanilla-like
  # Y15 batch with a lower uniform Y8~119 background so the upper band never collapses to zero.
  ancient_debris:
    enabled: true
    dimension: NETHER
    materials:
      stone: ANCIENT_DEBRIS
    y_min: 8
    y_max: 119
    preferred_y: 15
    # Two vanilla-like batches: a Y15 peak plus a rarer uniform Y8~119 background.
    y_weight_points:
      - { y: 8, weight: 0.65 }
      - { y: 15, weight: 1.0 }
      - { y: 22, weight: 0.65 }
      - { y: 119, weight: 0.65 }
    density: 1.0
    vein_size_min: 1
    vein_size_max: 3
    cell_chance: 0.045
    priority: 90
